version: '3.8'

services:
  soketi:
    image: soketi/soketi:latest
    ports:
      - "6001:6001"
    environment:
      DEBUG: "1"
      LOG_LEVEL: "debug"
      DEFAULT_APP_ID: "app-123"
      DEFAULT_APP_KEY: "app-key-123"
      DEFAULT_APP_SECRET: "app-secret-123"
    command: |
      soketi start
      --app-manager.array.apps='[{
        "id": "app-123",
        "key": "app-key-123",
        "secret": "app-secret-123",
        "enableClientMessages": true,
        "maxConnections": 100000,
        "maxBackendSubscriptions": 1000,
        "maxMessagesPerSecond": 1000
      }]'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6001/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - copilot-network

networks:
  copilot-network:
    driver: bridge
