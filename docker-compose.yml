version: "3.8"

services:
  # Laravel App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copilot_auth_app
    restart: unless-stopped
    working_dir: /app
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=copilot_auth
      - DB_USERNAME=copilot_user
      - DB_PASSWORD=copilot_password
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - copilot_network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: copilot_auth_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-copilot_auth}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-copilot_password}
      MYSQL_USER: ${DB_USERNAME:-copilot_user}
    volumes:
      - ./storage/docker/mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - copilot_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: copilot_auth_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s
    networks:
      - copilot_network

  # Node for Frontend
  node:
    image: node:18-alpine
    container_name: copilot_auth_node
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    command: npm run dev
    networks:
      - copilot_network

  # Docker MCP Toolkit Gateway for 3rd-party authenticated tools
  # Note: MCP Gateway uses stdio transport, not HTTP
  # Agents connect via: docker mcp gateway run (stdio)
  # This service pre-installs common MCP servers from Docker's catalog
  mcp-gateway:
    image: docker:latest
    container_name: copilot_mcp_gateway
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
      - mcp_config:/root/.docker/mcp
    networks:
      - copilot_network
    environment:
      - DOCKER_MCP_ENABLED=true
    # MCP Gateway runs on-demand via stdio, not as a background service
    # Agents invoke: docker exec copilot_mcp_gateway docker mcp gateway run
    command: sleep infinity

networks:
  copilot_network:
    driver: bridge

volumes:
  mcp_tools:
    driver: local
  mcp_config:
    driver: local
  mysql_data:
    driver: local
