<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Robot head -->
  <rect x="6" y="8" width="12" height="11" rx="2" stroke="#4B9EFF" stroke-width="2" fill="none"/>
  
  <!-- Eyes -->
  <circle cx="10" cy="13" r="1.5" fill="#00D8FF"/>
  <circle cx="14" cy="13" r="1.5" fill="#00D8FF"/>
  
  <!-- Mouth -->
  <line x1="9" y1="16" x2="15" y2="16" stroke="#4B9EFF" stroke-width="1.5"/>
  
  <!-- Antenna -->
  <line x1="12" y1="8" x2="12" y2="5" stroke="#4B9EFF" stroke-width="2"/>
  <circle cx="12" cy="4" r="1.5" fill="#00D8FF"/>
  
  <!-- Arms -->
  <line x1="6" y1="11" x2="3" y2="11" stroke="#4B9EFF" stroke-width="2"/>
  <line x1="18" y1="11" x2="21" y2="11" stroke="#4B9EFF" stroke-width="2"/>
  <circle cx="3" cy="11" r="1.5" fill="#00D8FF"/>
  <circle cx="21" cy="11" r="1.5" fill="#00D8FF"/>
</svg>
